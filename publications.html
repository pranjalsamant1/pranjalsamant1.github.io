<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publications · Pranjal Samant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #000000;
      min-height: 100vh;
      padding: 64px 24px;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
    }

    .back {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #000000;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 48px;
      letter-spacing: 0.01em;
      animation: popIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .back:hover { text-decoration: underline; }

    h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 40px;
      animation: popIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      margin-bottom: 32px;
      animation: popIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
    }

    .video-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .pub-title {
      font-size: 17px;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 8px;
      animation: popIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.22s both;
    }

    .pub-meta {
      font-size: 14px;
      color: #555555;
      margin-bottom: 28px;
      animation: popIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both;
    }

    .btn-paper {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #000000;
      text-decoration: none;
      border: 1.5px solid #000000;
      padding: 12px 28px;
      display: inline-block;
      transition: background 0.2s, color 0.2s;
      animation: popIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.34s both;
    }

    .btn-paper:hover {
      background: #000000;
      color: #ffffff;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.84);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Back</a>

    <h1>Publications</h1>

    <div class="video-wrap">
      <iframe
        src="https://www.youtube.com/embed/MXxTeyBVJWg?autoplay=1&mute=1&loop=1&playlist=MXxTeyBVJWg"
        allow="autoplay; encrypted-media"
        allowfullscreen
        title="Autonomous Robotic System Demo">
      </iframe>
    </div>

    <p class="pub-title">Autonomous Robotic System for Industry 4.0 — National Robotarium</p>
    <p class="pub-meta">Frontiers in Robotics and AI · 2025 · Peer-reviewed</p>

    <a class="btn-paper" href="https://www.frontiersin.org/journals/robotics-and-ai/articles/10.3389/frobt.2025.1506290/full" target="_blank">Read the paper →</a>
  </div>
</body>
</html>
