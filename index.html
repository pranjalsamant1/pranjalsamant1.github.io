<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pranjal Samant</title>
  <meta name="description" content="Pranjal Samant — Embedded and Robotics Engineer." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #000000;
      overflow-x: hidden;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      width: 100%;
      height: 78vh;
      min-height: 360px;
      overflow: hidden;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
      animation: heroIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* multi-directional blend into white background */
    .hero-fade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom,
          transparent 0%,
          transparent 32%,
          rgba(255,255,255,0.28) 50%,
          rgba(255,255,255,0.78) 72%,
          #ffffff 92%
        ),
        linear-gradient(to right,
          rgba(255,255,255,0.5) 0%,
          transparent 20%,
          transparent 80%,
          rgba(255,255,255,0.5) 100%
        );
    }

    /* ── CONTENT ── */
    .content {
      padding: 8px 24px 80px;
      text-align: center;
    }

    .intro {
      font-size: 22px;
      line-height: 1.65;
      margin-bottom: 44px;
      font-weight: 400;
      animation: popIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.18s both;
    }

    /* ── PREVIEW CARDS ── */
    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 600px;
      margin: 0 auto;
      animation: popIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.34s both;
    }

    .preview-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-decoration: none;
      color: #000;
    }

    .preview-card:hover .btn {
      background: #000;
      color: #fff;
    }

    .preview-img-box {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #f0f0f0;
    }

    .preview-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transition: transform 0.45s ease;
    }

    .preview-card:hover .preview-img-box img {
      transform: scale(1.05);
    }

    .preview-video-box {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    /* crop 16:9 video into a 1:1 square */
    .preview-video-box iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 177.78%;
      height: 100%;
      transform: translate(-50%, -50%);
      border: none;
      pointer-events: none;
    }

    .btn {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
      padding: 14px 24px;
      border: 1.5px solid #000;
      background: #fff;
      color: #000;
      text-align: center;
      letter-spacing: 0.02em;
      transition: background 0.2s, color 0.2s;
      display: block;
    }

    @keyframes heroIn {
      from { opacity: 0; transform: scale(1.05); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.87); }
      to   { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 600px) {
      .hero { height: 60vh; min-height: 280px; }
      .intro { font-size: 18px; margin-bottom: 32px; }
    }

    @media (max-width: 480px) {
      .preview-grid { grid-template-columns: 1fr; max-width: 380px; }
    }
  </style>
</head>
<body>

  <div class="hero">
    <img class="hero-img" src="assets/images/portfolio_picture.jpeg" alt="Pranjal Samant" />
    <div class="hero-fade"></div>
  </div>

  <div class="content">
    <p class="intro">
      Hi I'm <strong>Pranjal</strong>. I am a passionate Embedded and Robotics Engineer.<br>
      See my Work below&nbsp;:)
    </p>

    <div class="preview-grid">

      <a class="preview-card" href="projects.html">
        <div class="preview-img-box">
          <img src="assets/images/live_test.jpeg" alt="Projects" />
        </div>
        <span class="btn">Projects</span>
      </a>

      <a class="preview-card" href="publications.html">
        <div class="preview-video-box">
          <iframe
            src="https://www.youtube.com/embed/MXxTeyBVJWg?autoplay=1&mute=1&loop=1&playlist=MXxTeyBVJWg&controls=0"
            allow="autoplay; encrypted-media"
            title="Publications preview">
          </iframe>
        </div>
        <span class="btn">Publications</span>
      </a>

    </div>
  </div>

</body>
</html>
