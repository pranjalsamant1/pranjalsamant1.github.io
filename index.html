<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pranjal Samant</title>
  <meta name="description" content="Pranjal Samant — Embedded systems, robotics, and rapid prototyping." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      font-family: Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 48px 24px;
    }

    .photo {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      display: block;
      margin: 0 auto 32px;
      animation: popIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .bio {
      font-size: 18px;
      line-height: 1.7;
      max-width: 480px;
      margin: 0 auto 40px;
      font-weight: 400;
      animation: popIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      animation: popIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
    }

    .btn {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
      padding: 14px 36px;
      border: 1.5px solid #000000;
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.2s, color 0.2s;
      display: inline-block;
    }

    .btn:hover {
      background: #000000;
      color: #ffffff;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.82);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="photo" src="assets/images/portfolio_picture.jpeg" alt="Pranjal Samant" />

    <p class="bio">
      Hi, I am Pranjal. I have a passion for embedded and robotics.
      I like programming microcontrollers and rapid prototyping.
      I love working with both hardware and software.
    </p>

    <div class="buttons">
      <a class="btn" href="projects.html">Projects</a>
      <a class="btn" href="publications.html">Publications</a>
    </div>
  </div>
</body>
</html>
