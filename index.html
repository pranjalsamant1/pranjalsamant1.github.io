<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pranjal Samant</title>
  <meta name="description" content="Pranjal Samant — Embedded and Robotics Engineer." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 24px 80px;
      min-height: 100vh;
    }

    /* ── PHOTO ── */
    .photo {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      object-fit: cover;
      /* sky at top, face centre, chest at bottom of the circle */
      object-position: center 22%;
      display: block;
      margin-bottom: 32px;
      flex-shrink: 0;
      animation: popIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* ── INTRO ── */
    .intro {
      font-size: 21px;
      line-height: 1.65;
      text-align: center;
      max-width: 480px;
      margin-bottom: 48px;
      font-weight: 400;
      animation: popIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.18s both;
    }

    /* ── PREVIEW CARDS ── */
    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 580px;
      animation: popIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.34s both;
    }

    .preview-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-decoration: none;
      color: #000;
    }

    .preview-card:hover .btn {
      background: #000;
      color: #fff;
    }

    .preview-img-box {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #f0f0f0;
    }

    .preview-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transition: transform 0.45s ease;
    }

    .preview-card:hover .preview-img-box img {
      transform: scale(1.05);
    }

    .preview-video-box {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    /* crop 16:9 video into 1:1 square */
    .preview-video-box iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 177.78%;
      height: 100%;
      transform: translate(-50%, -50%);
      border: none;
      pointer-events: none;
    }

    .btn {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
      padding: 14px 24px;
      border: 1.5px solid #000;
      background: #fff;
      color: #000;
      text-align: center;
      letter-spacing: 0.02em;
      transition: background 0.2s, color 0.2s;
      display: block;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 600px) {
      .photo { width: 180px; height: 180px; }
      .intro { font-size: 17px; }
    }

    @media (max-width: 480px) {
      .preview-grid { grid-template-columns: 1fr; max-width: 340px; }
    }
  </style>
</head>
<body>

  <img class="photo"
       src="assets/images/portfolio_picture1.jpg"
       alt="Pranjal Samant" />

  <p class="intro">
    Hi I'm <strong>Pranjal</strong>. I am a passionate Embedded and Robotics Engineer.<br>
    See my Work below&nbsp;:)
  </p>

  <div class="preview-grid">

    <a class="preview-card" href="projects.html">
      <div class="preview-img-box">
        <img src="assets/images/live_test.jpeg" alt="Projects" />
      </div>
      <span class="btn">Projects</span>
    </a>

    <a class="preview-card" href="publications.html">
      <div class="preview-video-box">
        <iframe
          src="https://www.youtube.com/embed/MXxTeyBVJWg?autoplay=1&mute=1&loop=1&playlist=MXxTeyBVJWg&controls=0"
          allow="autoplay; encrypted-media"
          title="Publications preview">
        </iframe>
      </div>
      <span class="btn">Publications</span>
    </a>

  </div>

</body>
</html>
